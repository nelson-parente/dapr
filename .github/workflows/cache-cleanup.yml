# This workflow cleans up GitHub Actions caches scoped to a PR when the PR is
# closed or merged, preventing stale caches from accumulating and consuming
# Actions storage quota.

name: cache-cleanup

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete PR caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Deleting caches for PR #${PR_NUMBER}..."
          for ref in "refs/pull/${PR_NUMBER}/merge" "refs/pull/${PR_NUMBER}/head"; do
            echo "Cleaning caches for ref: ${ref}"
            gh api --method DELETE "/repos/${REPO}/actions/caches?ref=${ref}" || true
          done
        shell: bash
